<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="/My-Profile-Card/style.css">
</head>
<body>
    <div class="theme-toggle">
    <input type="checkbox" id="theme-switch"/>
    <label for="theme-switch" class="toggle-label">
      <span class="toggle-icon sun">☀️</span>
      <span class="toggle-icon moon">🌙</span>
    </label>
    </div>
    
    <nav class="navbar glass-card">
        <ul>
            <li><a href="../index.html">Profile</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

  <article class="glass-card contact-card">
    <div class="content-section">
      <header>
        <h2>Get In Touch</h2>
      </header>

      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" data-testid="test-contact-name" placeholder="Enter your name" required />
          <small class="error" id="error-name" data-testid="test-contact-error-name"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" data-testid="test-contact-email" placeholder="you@example.com" required />
          <small class="error" id="error-email" data-testid="test-contact-error-email"></small>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" data-testid="test-contact-subject" placeholder="Subject" required />
          <small class="error" id="error-subject" data-testid="test-contact-error-subject"></small>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="4" data-testid="test-contact-message" placeholder="Write your message..." required></textarea>
          <small class="error" id="error-message" data-testid="test-contact-error-message"></small>
        </div>

        <button type="submit" data-testid="test-contact-submit">Send Message</button>

        <p id="success-message" class="success" data-testid="test-contact-success"></p>
      </form>
    </div>
  </article>

  <script src="/My-Profile-Card/javascript/contact.js"></script>
</body>
</html>
